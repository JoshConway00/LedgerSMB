name: Publish deployment image

on:
  push:
    branches:
      - deploy/1.13.8
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ledgersmb-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/deploy/1.13.8' && github.repository == 'JoshConway00/LedgerSMB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: UI/yarn.lock

      - name: Build LedgerSMB UI
        run: make js

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish fork image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/joshconway00/ledgersmb:${{ github.sha }}
            ghcr.io/joshconway00/ledgersmb:deploy-1.13.8
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Record immutable image digest
        run: echo 'Deploy the digest reported by the Build and publish fork image step, not the moving branch tag.'
